<!DOCTYPE html>
<html>
<head>
    <title>Cluster Features</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial; background:#f0f2f5; padding:20px; }
        .container { max-width:800px; margin:0 auto; background:white; border-radius:10px; padding:30px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        h1 { color:#333; margin-bottom:5px; }
        .subtitle { color:#666; margin-bottom:20px; }
        .form-group { margin-bottom:15px; }
        label { display:block; font-weight:bold; margin-bottom:5px; font-size:14px; }
        input[type="text"], input[type="number"], select { width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:4px; font-size:14px; }
        .btn { padding:10px 24px; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:bold; margin-right:10px; }
        .btn-primary { background:#7c3aed; color:white; }
        .btn-primary:hover { opacity:0.8; }
        .btn-secondary { background:#6b7280; color:white; }
        .btn-secondary:hover { opacity:0.8; }
        .btn-success { background:#059669; color:white; }
        .btn-success:hover { opacity:0.8; }
        .btn-danger { background:#dc2626; color:white; }
        .btn-danger:hover { opacity:0.8; }
        .progress-section { margin-top:20px; padding:15px; background:#f9fafb; border-radius:6px; display:none; }
        .progress-bar { width:100%; height:20px; background:#e5e7eb; border-radius:10px; overflow:hidden; }
        .progress-fill { height:100%; background:#7c3aed; transition:width 0.3s; width:0%; }
        .progress-text { margin-top:8px; font-size:13px; color:#666; }
        .btn-group { margin-top:20px; }
        .btn-back { display:inline-block; padding:8px 16px; background:#6b7280; color:white; text-decoration:none; border-radius:6px; font-size:13px; margin-bottom:15px; }
        .btn-back:hover { opacity:0.8; }
        .param-group { padding:10px; background:#f9fafb; border-radius:4px; margin-bottom:10px; }
        .param-group.hidden { display:none; }
        .info-box { background:#e8f4fd; padding:10px; border-radius:4px; margin-bottom:15px; font-size:13px; color:#1a56db; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
        <h1>🔮 Cluster Features</h1>
        <p class="subtitle">Cluster extracted features using FAISS K-Means or Agglomerative</p>
        
        <div class="info-box">
            💡 For large datasets (10,000+ images), Agglomerative clustering will use sampling for performance.
        </div>
        
        <form id="clusterForm">
            <div class="form-group">
                <label>Features File (.dat)</label>
                <input type="text" id="featuresFile" placeholder="C:/path/to/features.dat" value="C:/Users/Manar/Documents/REID/Cluster_id/extracted_features/2026041316/features_dataset.dat">
            </div>
            <div class="form-group">
                <label>Paths File (.json)</label>
                <input type="text" id="pathsFile" placeholder="C:/path/to/paths.json" value="C:/Users/Manar/Documents/REID/Cluster_id/extracted_features/2026041316/features_dataset_paths.json">
            </div>
            <div class="form-group">
                <label>Meta File (.json) - Optional</label>
                <input type="text" id="metaFile" placeholder="C:/path/to/meta.json" value="C:/Users/Manar/Documents/REID/Cluster_id/extracted_features/2026041316/features_dataset_meta.json">
            </div>
            
            <div class="form-group">
                <label>Clustering Algorithm</label>
                <select id="algorithm" onchange="toggleParams()">
                    <option value="faiss">FAISS K-Means</option>
                    <option value="agg" selected>Agglomerative</option>
                </select>
            </div>
            
            <!-- FAISS Parameters -->
            <div id="faissParams" class="param-group hidden">
                <div class="form-group">
                    <label>Number of Clusters (K)</label>
                    <input type="number" id="faissK" value="250" min="2">
                </div>
                <div class="form-group">
                    <label>Random Seed</label>
                    <input type="number" id="faissSeed" value="42">
                </div>
                <div class="form-group">
                    <label>Iterations</label>
                    <input type="number" id="faissIter" value="100" min="10">
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="faissGpu"> Use GPU (if available)</label>
                </div>
            </div>
            
            <!-- Agglomerative Parameters -->
            <div id="aggParams" class="param-group">
                <div class="form-group">
                    <label>Distance Threshold</label>
                    <input type="number" id="aggThreshold" value="0.4" step="0.05" min="0.1" max="2.0">
                    <small>Higher = fewer clusters (for 18k images, try 0.3-0.6)</small>
                </div>
                <div class="form-group">
                    <label>Linkage</label>
                    <select id="aggLinkage">
                        <option value="complete">Complete</option>
                        <option value="average">Average</option>
                        <option value="single">Single</option>
                        <option value="ward">Ward</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Affinity</label>
                    <select id="aggAffinity">
                        <option value="cosine">Cosine</option>
                        <option value="euclidean">Euclidean</option>
                        <option value="manhattan">Manhattan</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Output Directory</label>
                <input type="text" id="outputDir" placeholder="./clustered_dataset/" value="./clustered_dataset/2026041316/">
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-primary" onclick="startClustering()">▶ Start Clustering</button>
                <button type="button" class="btn btn-secondary" onclick="saveConfig()">💾 Save Config</button>
            </div>
        </form>
        
        <div class="progress-section" id="progressSection">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Processing...</div>
            <button type="button" class="btn btn-danger" onclick="cancelClustering()" style="margin-top:10px;">⛔ Cancel</button>
        </div>
    </div>
    
    <script>
        let clusteringRunning = false;
        
        function toggleParams() {
            const alg = document.getElementById('algorithm').value;
            document.getElementById('faissParams').classList.toggle('hidden', alg !== 'faiss');
            document.getElementById('aggParams').classList.toggle('hidden', alg !== 'agg');
        }
        
        async function startClustering() {
            const data = {
                features_file: document.getElementById('featuresFile').value,
                paths_file: document.getElementById('pathsFile').value,
                meta_file: document.getElementById('metaFile').value || null,
                algorithm: document.getElementById('algorithm').value,
                output_dir: document.getElementById('outputDir').value,
                parameters: {}
            };
            
            if (data.algorithm === 'faiss') {
                data.parameters = {
                    k: parseInt(document.getElementById('faissK').value),
                    seed: parseInt(document.getElementById('faissSeed').value),
                    iterations: parseInt(document.getElementById('faissIter').value),
                    gpu: document.getElementById('faissGpu').checked
                };
            } else {
                data.parameters = {
                    threshold: parseFloat(document.getElementById('aggThreshold').value),
                    linkage: document.getElementById('aggLinkage').value,
                    affinity: document.getElementById('aggAffinity').value
                };
            }
            
            document.getElementById('progressSection').style.display = 'block';
            clusteringRunning = true;
            
            try {
                const response = await fetch('/api/dashboard/cluster/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    updateClusterProgress();
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                    clusteringRunning = false;
                }
            } catch(e) {
                alert('Error: ' + e.message);
                clusteringRunning = false;
            }
        }
        
        async function updateClusterProgress() {
            if (!clusteringRunning) return;
            try {
                const response = await fetch('/api/dashboard/cluster/status');
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('progressText').textContent = '❌ ' + data.error;
                    document.getElementById('progressFill').style.width = '0%';
                    clusteringRunning = false;
                    return;
                }
                
                document.getElementById('progressFill').style.width = data.percent + '%';
                
                let statusText = data.message || 'Processing...';
                if (data.clusters > 0) {
                    statusText += ` | Clusters: ${data.clusters}`;
                }
                if (data.percent < 100 && data.percent > 0) {
                    statusText += ` | ${Math.round(data.percent)}%`;
                }
                document.getElementById('progressText').textContent = statusText;
                
                if (data.percent < 100 && clusteringRunning) {
                    setTimeout(updateClusterProgress, 1000);
                } else if (data.percent >= 100) {
                    document.getElementById('progressText').textContent = '✅ Done! ' + data.clusters + ' clusters formed';
                    clusteringRunning = false;
                }
            } catch(e) {
                console.error(e);
                document.getElementById('progressText').textContent = '❌ Error: ' + e.message;
                clusteringRunning = false;
            }
        }
        
        async function cancelClustering() {
            clusteringRunning = false;
            await fetch('/api/dashboard/cluster/cancel', {method: 'POST'});
            document.getElementById('progressText').textContent = '⛔ Cancelled';
        }
        
        async function saveConfig() {
            const data = {
                method: document.getElementById('algorithm').value,
                output_dir: document.getElementById('outputDir').value,
                parameters: {}
            };
            
            if (data.method === 'faiss') {
                data.parameters = {
                    k: parseInt(document.getElementById('faissK').value),
                    seed: parseInt(document.getElementById('faissSeed').value),
                    iterations: parseInt(document.getElementById('faissIter').value),
                    gpu: document.getElementById('faissGpu').checked
                };
            } else {
                data.parameters = {
                    threshold: parseFloat(document.getElementById('aggThreshold').value),
                    linkage: document.getElementById('aggLinkage').value,
                    affinity: document.getElementById('aggAffinity').value
                };
            }
            
            const configData = {
                features_file: document.getElementById('featuresFile').value,
                paths_file: document.getElementById('pathsFile').value,
                meta_file: document.getElementById('metaFile').value || null,
                method: document.getElementById('algorithm').value,
                output_dir: document.getElementById('outputDir').value,
                parameters: data.parameters
            };
            
            await fetch('/api/dashboard/config/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({step: 'clustering', data: configData})
            });
            alert('Configuration saved!');
        }
        
        // Initialize
        toggleParams();
    </script>
</body>
</html>
